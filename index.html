<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker d'archimonstres</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Tracker d'archimonstres</h1>
  <a class="lien-repo" href="https://github.com/kenokeefe91/dofus-archimonstre-web-tracker" target="_blank" rel="noopener" aria-label="Voir le repo GitHub">
    <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <div id="stats"></div>
  <div class="progress"><div id="progress-bar"></div></div>
  <div id="pierres"></div>
</header>
<div id="filters">
  <input id="search" type="search" placeholder="Rechercher un archimonstre ou un monstre...">
  <select id="filter-zone"><option value="">Toutes les zones</option></select>
  <select id="filter-pierre"><option value="">Toutes les pierres</option></select>
  <select id="filter-statut">
    <option value="tous">Tous</option>
    <option value="captures">Capturés</option>
    <option value="non-captures">Non capturés</option>
  </select>
  <label style="align-self:center;font-size:14px"><input type="checkbox" id="masquer-captures"> Cacher les capturés</label>
  <select id="sort">
    <option value="nom">Tri : nom</option>
    <option value="lvl">Tri : niveau max</option>
    <option value="pierre">Tri : pierre d'âme</option>
  </select>
  <span id="compteur"></span>
  <button id="reset" type="button">Réinitialiser</button>
</div>
<table>
  <thead>
    <tr>
      <th>Capturé</th>
      <th>Archimonstre</th>
      <th>Monstre</th>
      <th>Niveau</th>
      <th>Étapes</th>
      <th>Pierre d'âme</th>
      <th>Zones</th>
    </tr>
  </thead>
  <tbody id="liste"></tbody>
</table>
</body>
</html>
