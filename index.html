<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker d'archimonstres</title>
<style>
  :root {
    --fond: #1b1e27;
    --panneau: #262a38;
    --texte: #e8e6df;
    --accent: #d4a94e;
    --ok: #3f7d4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--fond);
    color: var(--texte);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--panneau);
    padding: 12px 20px;
    border-bottom: 2px solid var(--accent);
  }
  h1 { margin: 0 0 6px; font-size: 20px; color: var(--accent); }
  #stats { font-size: 14px; margin-bottom: 6px; }
  .progress {
    height: 8px;
    background: #11131a;
    border-radius: 4px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    width: 0;
    background: var(--ok);
    transition: width 0.2s;
  }
  #filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px;
    background: var(--panneau);
    position: sticky;
    top: 86px;
    border-bottom: 1px solid #3a3f52;
  }
  #filters input[type="search"] { flex: 1 1 220px; }
  #filters select, #filters input[type="search"], #filters button {
    background: var(--fond);
    color: var(--texte);
    border: 1px solid #3a3f52;
    border-radius: 4px;
    padding: 6px 8px;
  }
  #filters button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
  #compteur { font-size: 12px; opacity: 0.7; align-self: center; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #2c3040;
    vertical-align: top;
  }
  th {
    position: sticky;
    top: 140px;
    background: var(--panneau);
    color: var(--accent);
  }
  tr.capture-ok td { background: rgba(63, 125, 78, 0.18); }
  td input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Tracker d'archimonstres</h1>
  <div id="stats"></div>
  <div class="progress"><div id="progress-bar"></div></div>
</header>
<div id="filters">
  <input id="search" type="search" placeholder="Rechercher un archimonstre ou un monstre...">
  <select id="filter-zone"><option value="">Toutes les zones</option></select>
  <select id="filter-pierre"><option value="">Toutes les pierres</option></select>
  <select id="filter-statut">
    <option value="tous">Tous</option>
    <option value="captures">Capturés</option>
    <option value="non-captures">Non capturés</option>
  </select>
  <label style="align-self:center;font-size:14px"><input type="checkbox" id="masquer-captures"> Cacher les capturés</label>
  <select id="sort">
    <option value="nom">Tri : nom</option>
    <option value="lvl">Tri : niveau max</option>
    <option value="pierre">Tri : pierre d'âme</option>
  </select>
  <span id="compteur"></span>
  <button id="reset" type="button">Réinitialiser</button>
</div>
<table>
  <thead>
    <tr>
      <th>Capturé</th>
      <th>Archimonstre</th>
      <th>Monstre</th>
      <th>Niveau</th>
      <th>Étapes</th>
      <th>Pierre d'âme</th>
      <th>Zones</th>
    </tr>
  </thead>
  <tbody id="liste"></tbody>
</table>

const STORAGE_KEY = 'archimonstre_tracker_v1';

function defaultState() {
  const captures = {};
  SEED.archimonstres.forEach(function (a) {
    captures[a.id] = { capture: false };
  });
  return { captures: captures };
}

function loadState() {
  const brut = localStorage.getItem(STORAGE_KEY);
  if (!brut) {
    return defaultState();
  }
  try {
    const lu = JSON.parse(brut);
    const fusion = defaultState();
    SEED.archimonstres.forEach(function (a) {
      const e = lu.captures ? lu.captures[a.id] : null;
      if (e) {
        fusion.captures[a.id] = { capture: !!e.capture };
      }
    });
    return fusion;
  } catch (err) {
    return defaultState();
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

if (typeof document !== 'undefined') {
  let state = loadState();
  const zonesParId = {};
  SEED.zones.forEach(function (z) { zonesParId[z.id] = z.nom; });
  const pierresParId = {};
  SEED.pierres.forEach(function (p) { pierresParId[p.id] = p; });

  function el(id) {
    return document.getElementById(id);
  }

  function majStats() {
    const total = SEED.archimonstres.length;
    const faits = SEED.archimonstres.filter(function (a) {
      return state.captures[a.id].capture;
    }).length;
    const pct = Math.round(faits / total * 100);
    el('stats').textContent = faits + ' / ' + total + ' archimonstres capturés (' + pct + ' %)';
    el('progress-bar').style.width = pct + '%';
  }

  function remplirSelects() {
    const selZone = el('filter-zone');
    SEED.zones.forEach(function (z) {
      const o = document.createElement('option');
      o.value = z.id;
      o.textContent = z.nom;
      selZone.appendChild(o);
    });
    const selPierre = el('filter-pierre');
    SEED.pierres.forEach(function (p) {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.nom + ' (max ' + p.lvl_max + ')';
      selPierre.appendChild(o);
    });
  }

  const comparateurs = {
    nom: function (a, b) { return a.nom.localeCompare(b.nom); },
    lvl: function (a, b) { return (a.lvl_max - b.lvl_max) || a.nom.localeCompare(b.nom); },
    pierre: function (a, b) {
      return (pierresParId[a.pierre_dame_id].lvl_max - pierresParId[b.pierre_dame_id].lvl_max) || a.nom.localeCompare(b.nom);
    }
  };

  function archisFiltres() {
    const q = el('search').value.trim().toLowerCase();
    const zone = el('filter-zone').value;
    const pierre = el('filter-pierre').value;
    const statut = el('filter-statut').value;
    const liste = SEED.archimonstres.filter(function (a) {
      if (q && a.nom.toLowerCase().indexOf(q) === -1 && a.monstre.toLowerCase().indexOf(q) === -1) return false;
      if (zone && a.zones_ids.indexOf(Number(zone)) === -1) return false;
      if (pierre && String(a.pierre_dame_id) !== pierre) return false;
      if (statut === 'captures' && !state.captures[a.id].capture) return false;
      if (statut === 'non-captures' && state.captures[a.id].capture) return false;
      if (el('masquer-captures').checked && state.captures[a.id].capture) return false;
      return true;
    });
    const cmp = comparateurs[el('sort').value] || comparateurs.nom;
    return liste.sort(cmp);
  }

  function cellule(tr, texte) {
    const td = document.createElement('td');
    td.textContent = texte;
    tr.appendChild(td);
  }

  function ligne(a) {
    const tr = document.createElement('tr');
    const possede = state.captures[a.id];
    if (possede.capture) {
      tr.className = 'capture-ok';
    }

    const tdCheck = document.createElement('td');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = possede.capture;
    check.addEventListener('change', function () {
      state.captures[a.id].capture = check.checked;
      saveState(state);
      majStats();
      render();
    });
    tdCheck.appendChild(check);
    tr.appendChild(tdCheck);

    cellule(tr, a.nom);
    cellule(tr, a.monstre);
    cellule(tr, a.lvl_min + ' - ' + a.lvl_max);
    cellule(tr, String(a.etapes));
    cellule(tr, a.pierre_dame);
    cellule(tr, a.zones_ids.map(function (zid) { return zonesParId[zid] || zid; }).join(', '));

    return tr;
  }

  function render() {
    const liste = archisFiltres();
    const tbody = el('liste');
    tbody.textContent = '';
    liste.forEach(function (a) {
      tbody.appendChild(ligne(a));
    });
    el('compteur').textContent = liste.length + ' affiché(s)';
  }

  function init() {
    remplirSelects();
    ['search', 'filter-zone', 'filter-pierre', 'filter-statut', 'masquer-captures', 'sort'].forEach(function (id) {
      el(id).addEventListener('input', render);
      el(id).addEventListener('change', render);
    });
    el('reset').addEventListener('click', function () {
      if (!confirm('Revenir à l\'état d\'origine de la base ?')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      saveState(state);
      render();
      majStats();
    });
    render();
    majStats();
  }

  init();
}
